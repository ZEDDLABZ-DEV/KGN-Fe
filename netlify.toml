[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_USE_PROXY = "true"

# Proxy API requests to EC2 (avoids mixed-content & browser CORS issues)
[[redirects]]
  from = "/v1/*"
  to = "http://ec2-13-201-225-147.ap-south-1.compute.amazonaws.com:3000/v1/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
