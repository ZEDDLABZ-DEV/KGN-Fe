[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_USE_PROXY = "true"

# Proxy API requests to the Render backend (temporary test deployment)
[[redirects]]
  from = "/v1/*"
  to = "https://kgn-be.onrender.com/v1/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
